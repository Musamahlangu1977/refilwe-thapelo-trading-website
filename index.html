<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refilwe Thapelo Trading &amp; Projects</title>
    <meta name="description" content="Official website for Refilwe Thapelo Trading &amp; Projects, showcasing its agricultural, food, transport, storage and business services." />

    <!-- Favicons (served from /public at the site root) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111111" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Refilwe Thapelo Trading &amp; Projects" />
    <meta property="og:title" content="Refilwe Thapelo Trading &amp; Projects" />
    <meta property="og:description" content="Official website for Refilwe Thapelo Trading &amp; Projects, showcasing its agricultural, food, transport, storage and business services." />
    <meta property="og:url" content="https://refilwethapelo.com/" />
    <meta property="og:image" content="https://refilwethapelo.com/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <!-- Static form blueprint allows Netlify to detect the React enquiry form at build time. -->
    <form name="service-inquiry" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="service-inquiry" />
      <select name="business-division"><option value="General Inquiry">General Inquiry</option></select>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
